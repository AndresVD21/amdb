<nav
  class="bg-indigo-900/95 backdrop-blur-lg border-b border-indigo-800 sticky top-0 z-50"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo and Brand -->
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-3">
          <div
            class="w-10 h-10 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center"
          >
            <a routerLink="/">
              <img src="/logo_tiny_white.png" alt="AMDB Logo" />
            </a>
          </div>
          <div>
            <h1 class="text-xl font-bold text-white">AMDB</h1>
            <p class="text-xs text-indigo-200">Your Anime Universe</p>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-6">
        <a
          routerLink="/"
          routerLinkActive="text-purple-300"
          [routerLinkActiveOptions]="{exact: true}"
          class="text-indigo-200 hover:text-white transition-colors font-medium"
        >
          Discover
        </a>
        <button
          routerLink="/my-list"
          routerLinkActive="text-purple-300"
          [routerLinkActiveOptions]="{exact: true}"
          class="text-indigo-200 hover:text-white transition-colors font-medium"
        >
          My List
        </button>
      </div>

      <!-- User Menu -->
      <div class="flex items-center space-x-4">

        <!-- User Profile Dropdown -->
        <button
          class="relative"
          (click)="toggleUserMenu()"
          [ariaHasPopup]="true"
          [ariaExpanded]="showUserMenu"
        >
          <button
            class="flex items-center space-x-2 p-2 text-indigo-200 hover:text-white hover:bg-indigo-800 rounded-lg transition-all duration-200"
          >
            <lucide-icon [img]="userIcon" class="w-5 h-5"></lucide-icon>
            <span class="text-sm font-medium">{{ name }}</span>
          </button>

          <!-- Dropdown Menu -->
          <div
            *ngIf="showUserMenu"
            class="absolute right-0 mt-2 w-48 bg-indigo-800 border border-indigo-700 rounded-xl shadow-xl z-50"
            [attr.aria-hidden]="!showUserMenu"
          >
            <div class="py-2">
              <button
                class="w-full px-4 py-2 text-left text-indigo-200 hover:text-white hover:bg-indigo-700 transition-colors duration-200 flex items-center space-x-2"
              >
                <lucide-icon [img]="userIcon" class="w-4 h-4"></lucide-icon>
                <span>Profile</span>
              </button>
              <a
                routerLink="/my-list"
                class="w-full px-4 py-2 text-left text-indigo-200 hover:text-white hover:bg-indigo-700 transition-colors duration-200 flex items-center space-x-2"
              >
                <lucide-icon [img]="starIcon" class="w-4 h-4"></lucide-icon>
                <span>My Favorites</span>
              </a>
              <hr class="border-indigo-700 my-2" />
              <button
                (click)="logout()"
                class="w-full px-4 py-2 text-left text-red-400 hover:text-red-300 hover:bg-indigo-700 transition-colors duration-200 flex items-center space-x-2"
              >
                <lucide-icon [img]="logOutIcon" class="w-4 h-4"></lucide-icon>
                <span>Logout</span>
              </button>
            </div>
          </div>
        </button>
      </div>
    </div>
  </div>
</nav>
