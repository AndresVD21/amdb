<nav
  class="bg-gray-900/95 backdrop-blur-lg border-b border-gray-800 sticky top-0 z-50"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo and Brand -->
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-3">
          <div
            class="w-10 h-10 bg-gradient-to-r from-gray-600 to-gray-800 rounded-xl flex items-center justify-center"
          >
            <a routerLink="/">
              <img src="/logo_tiny_white.png" alt="AMDB Logo" />
            </a>
          </div>
          <div>
            <h1 class="text-xl font-bold text-white">AMDB</h1>
            <p class="text-xs text-gray-400">Your Anime Universe</p>
          </div>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-2xl mx-8">
        <div class="relative">
          <lucide-icon
            [img]="searchIcon"
            class="absolute left-2 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"
          ></lucide-icon>
          <input
            type="text"
            placeholder="Search anime, characters, genres..."
            class="w-full pl-10 pr-4 py-2 bg-gray-800/50 border border-gray-700 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-600 focus:border-transparent transition-all duration-200"
          />
        </div>
      </div>

      <!-- User Menu -->
      <div class="flex items-center space-x-4">
        <!-- Notifications -->
        <button
          class="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-all duration-200"
        >
          <lucide-icon [img]="bellIcon" class="w-5 h-5"></lucide-icon>
        </button>

        <!-- Settings -->
        <button
          class="p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-all duration-200"
        >
          <lucide-icon [img]="settingsIcon" class="w-5 h-5"></lucide-icon>
        </button>

        <!-- User Profile Dropdown -->
        <button
          class="relative"
          (click)="toggleUserMenu()"
          [ariaHasPopup]="true"
          [ariaExpanded]="showUserMenu"
        >
          <button
            class="flex items-center space-x-2 p-2 text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-all duration-200"
          >
            <lucide-icon [img]="userIcon" class="w-5 h-5"></lucide-icon>
            <span class="text-sm font-medium">User</span>
          </button>

          <!-- Dropdown Menu -->
          <div
            *ngIf="showUserMenu"
            class="absolute right-0 mt-2 w-48 bg-gray-800 border border-gray-700 rounded-xl shadow-xl z-50"
            [attr.aria-hidden]="!showUserMenu"
          >
            <div class="py-2">
              <button
                class="w-full px-4 py-2 text-left text-gray-300 hover:text-white hover:bg-gray-700 transition-colors duration-200 flex items-center space-x-2"
              >
                <lucide-icon [img]="userIcon" class="w-4 h-4"></lucide-icon>
                <span>Profile</span>
              </button>
              <button
                class="w-full px-4 py-2 text-left text-gray-300 hover:text-white hover:bg-gray-700 transition-colors duration-200 flex items-center space-x-2"
              >
                <lucide-icon [img]="settingsIcon" class="w-4 h-4"></lucide-icon>
                <span>Settings</span>
              </button>
              <hr class="border-gray-700 my-2" />
              <button
                (click)="logout()"
                class="w-full px-4 py-2 text-left text-red-400 hover:text-red-300 hover:bg-gray-700 transition-colors duration-200 flex items-center space-x-2"
              >
                <lucide-icon [img]="logOutIcon" class="w-4 h-4"></lucide-icon>
                <span>Logout</span>
              </button>
            </div>
          </div>
        </button>
      </div>
    </div>
  </div>
</nav>
