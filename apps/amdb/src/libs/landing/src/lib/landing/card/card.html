<a
  class="group cursor-pointer flex h-full focus:outline-none focus:ring-2 focus:ring-purple-500/20 rounded-2xl"
  [routerLink]="['/details', activeTab, item.mal_id]"
  [attr.aria-label]="item.title + ' - ' + item.type + ' series'"
  role="article"
>
  <div
    class="flex-grow bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl overflow-hidden hover:bg-indigo-600/20 transition-all duration-300 transform hover:scale-105"
  >
    <!-- Rank Badge -->
    <div class="relative">
      <div
        class="aspect-[3/4] bg-gradient-to-br from-indigo-900 to-purple-900 relative overflow-hidden"
      >
        <img
          [src]="item.images.jpg.image_url"
          [alt]="item.title"
          class="absolute inset-0 w-full h-full object-cover"
          loading="lazy"
        />
        <div class="absolute inset-0 bg-black/30"></div>
        <div class="absolute inset-0 flex items-center justify-center" aria-hidden="true">
          <lucide-icon
            [img]="item.type === 'TV' ? playIcon : bookOpenIcon"
            class="w-16 h-16 text-white/50"
          ></lucide-icon>
        </div>
        <!-- Rating -->
        <div class="absolute top-4 right-4">
          <div class="bg-black/50 backdrop-blur-sm rounded-lg px-2 py-1">
            <div class="flex items-center space-x-1" role="text" [attr.aria-label]="'Rating: ' + item.rating">
              <lucide-icon
                [img]="starIcon"
                class="w-4 h-4 text-purple-300"
                aria-hidden="true"
              ></lucide-icon>
              <span class="text-white text-sm font-medium">{{ item.rating }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Content Info -->
    <div class="p-4">
      <h3
        class="text-white font-semibold mb-2 group-hover:text-indigo-200 transition-colors duration-200 line-clamp-2"
      >
        {{ item.title }}
      </h3>
      <p class="text-gray-400 text-sm mb-2">{{formattedGenres}}</p>
      <div class="flex items-center justify-between text-xs" *ngIf="item.type === 'TV'">
        <span class="text-gray-500">{{ item.year }}</span>
        <span class="text-gray-500" *ngIf="item.episodes">{{ item.episodes + ' episodes' }}</span>
      </div>
      <div class="mt-3">
        <span
          class="inline-block px-2 py-1 bg-gray-700/50 text-gray-300 text-xs rounded-lg"
        >
          {{ item.status }}
        </span>
      </div>
    </div>
  </div>
</a>
