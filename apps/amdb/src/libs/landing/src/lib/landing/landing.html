<!-- Main Content -->
<div class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-fuchsia-900">
  <!-- Hero Section -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="text-center">
      <h1 class="text-5xl md:text-7xl font-bold text-white mb-6">
        Welcome to
        <span
          class="bg-gradient-to-r from-indigo-400 to-purple-500 bg-clip-text text-transparent"
        >
          AMDB
        </span>
      </h1>
      <p class="text-xl text-indigo-200 mb-8 max-w-3xl mx-auto">
        Discover, track, and explore your favorite anime series. Join millions
        of fans in the ultimate anime database experience.
      </p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a
          routerLink="/my-list"
          class="px-8 py-4 bg-white/10 border border-white/20 text-white font-semibold rounded-xl hover:bg-indigo-600/20 transition-all duration-200"
        >
          My Favorites
        </a>
      </div>
    </div>
  </div>

  <!-- Featured Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <!-- Section Header with Tabs -->
    <div class="mb-8">
      <h2 class="text-3xl font-bold text-white mb-6 text-center">
        Most Popular
      </h2>

      <!-- Tab Navigation -->
      <div class="mb-8">
        <div class="flex justify-center space-x-1 bg-gray-800/50 rounded-lg p-1 max-w-xs mx-auto">
          <button
            (click)="setActiveTab('anime')"
            [class]="activeTab === 'anime' ? 'bg-purple-600 text-white' : 'text-gray-400 hover:text-white'"
            class="flex-1 py-2 px-4 rounded-md transition-all duration-200 font-medium"
          >
            <lucide-icon [img]="playIcon" class="w-4 h-4 inline mr-2"></lucide-icon>
            Anime
          </button>
          <button
            (click)="setActiveTab('manga')"
            [class]="activeTab === 'manga' ? 'bg-purple-600 text-white' : 'text-gray-400 hover:text-white'"
            class="flex-1 py-2 px-4 rounded-md transition-all duration-200 font-medium"
          >
            <lucide-icon [img]="bookOpenIcon" class="w-4 h-4 inline mr-2"></lucide-icon>
            Manga
          </button>
        </div>
      </div>

    <!-- Content Grid -->
    <div
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
    >
      <lib-card *ngFor="let item of getActiveContent(); let i = index" [activeTab]="activeTab" [item]="item" [i]="i"></lib-card>
    </div>
    <div class="text-center mt-12">
      <a
        [routerLink]="['/view-all', activeTab]"
        class="px-8 py-4 bg-white/10 border border-white/20 text-white font-semibold rounded-xl hover:bg-indigo-600/20 transition-all duration-200"
      >
        View All {{ activeTab === 'anime' ? 'Anime' : 'Manga' }}
      </a>
    </div>
  </div>
</div>
