  <!-- Featured Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <!-- Section Header with Tabs -->
    <div class="mb-8">
      <h2 class="text-3xl font-bold text-white mb-6 text-center">
        Most Popular
      </h2>

      <!-- Tab Navigation -->
      <div class="flex justify-center mb-8">
        <div
          class="bg-gray-800/50 backdrop-blur-lg border border-gray-700 rounded-2xl p-2 flex space-x-2"
        >
          <button
            (click)="setActiveTab('anime')"
            [class]="activeTab === 'anime' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'"
            class="px-6 py-3 rounded-xl font-medium transition-all duration-200 flex items-center space-x-2"
          >
            <lucide-icon [img]="playIcon" class="w-5 h-5"></lucide-icon>
            <span>Popular Anime</span>
          </button>
          <button
            (click)="setActiveTab('manga')"
            [class]="activeTab === 'manga' ? 'bg-gray-700 text-white' : 'text-gray-400 hover:text-white'"
            class="px-6 py-3 rounded-xl font-medium transition-all duration-200 flex items-center space-x-2"
          >
            <lucide-icon [img]="bookOpenIcon" class="w-5 h-5"></lucide-icon>
            <span>Popular Manga</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Content Grid -->
    <div
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
    >
      <lib-card *ngFor="let item of getActiveContent(); let i = index" [activeTab]="activeTab" [item]="item" [i]="i"></lib-card>
    </div>
    <div class="text-center mt-12">
      <button
        class="px-8 py-4 bg-white/10 border border-white/20 text-white font-semibold rounded-xl hover:bg-white/20 transition-all duration-200"
      >
        View All {{ activeTab === 'anime' ? 'Anime' : 'Manga' }}
      </button>
    </div>
  </div>
  <lib-footer></lib-footer>
</div>
