<div class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-fuchsia-900 flex items-center justify-center p-4">
  <!-- Background decorative elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-32 h-32 bg-purple-500 rounded-full opacity-10 animate-pulse"></div>
    <div class="absolute bottom-20 right-20 w-24 h-24 bg-indigo-400 rounded-full opacity-15 animate-bounce"></div>
    <div class="absolute top-1/2 left-1/4 w-16 h-16 bg-fuchsia-400 rounded-full opacity-20"></div>
    <div class="absolute bottom-1/3 left-10 w-20 h-20 bg-violet-500 rounded-full opacity-10"></div>
  </div>

  <!-- Login Card -->
  <div class="relative w-full max-w-md">
    <div class="backdrop-blur-lg bg-white/10 border border-white/20 rounded-3xl p-8 shadow-2xl">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl mb-4">
          <img src="/logo_tiny_white.png" alt="AMDB Logo">
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">AMDB</h1>
        <p class="text-indigo-200">Welcome back to your anime universe</p>
      </div>

      <!-- Login Form -->
      <form (submit)="onSubmit()" [formGroup]="formData" class="space-y-6">
        <!-- Email Field -->
        <div class="space-y-2">
          <label for="email" class="text-sm font-medium text-indigo-200">
            Email Address
          </label>
          <div class="relative">
            <lucide-icon [img]="mailIcon" class="absolute left-2 top-1/2 transform -translate-y-1/2 w-5 h-5 text-indigo-300"></lucide-icon>
            <input
              type="email"
              id="email"
              name="email"
              formControlName="email"
              class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200"
              placeholder="Enter your email"
              required
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-2">
          <label for="password" class="text-sm font-medium text-indigo-200">
            Password
          </label>
          <div class="relative">
            <lucide-icon [img]="lockIcon" class="absolute left-2 top-1/2 transform -translate-y-1/2 w-5 h-5 text-indigo-300"></lucide-icon>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              formControlName="password"
              class="w-full pl-10 pr-12 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200"
              placeholder="Enter your password"
              required
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-indigo-300 hover:text-white transition-colors duration-200"
            >
              <lucide-icon [img]="showPassword ? eyeOffIcon : eyeIcon" class="w-5 h-5"></lucide-icon>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <label class="flex items-center space-x-3 cursor-pointer">
            <input
              type="checkbox"
              name="rememberMe"
              formControlName="rememberMe"
              class="w-4 h-4 rounded border-white/20 bg-white/10 text-purple-600 focus:ring-purple-500 focus:ring-2"
            />
            <span class="text-sm text-indigo-200">Remember me</span>
          </label>
          <button
            type="button"
            class="text-sm text-indigo-300 hover:text-white transition-colors duration-200"
          >
            Forgot password?
          </button>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full py-3 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg transform transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-transparent disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none"
        >
          <div *ngIf="isLoading" class="flex items-center justify-center space-x-2">
            <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            <span>Signing in...</span>
          </div>
          <span *ngIf="!isLoading">Sign In</span>
        </button>
      </form>

      <!-- Sign Up Link -->
      <p class="mt-6 text-center text-indigo-200">
        Don't have an account?
        <a routerLink="/signup" class="text-purple-400 hover:text-purple-300 font-medium transition-colors duration-200">
          Sign up
        </a>
      </p>
    </div>
    <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2 w-32 h-8 bg-gradient-to-r from-indigo-500 to-purple-600 opacity-30 blur-xl rounded-full"></div>
  </div>
</div>
