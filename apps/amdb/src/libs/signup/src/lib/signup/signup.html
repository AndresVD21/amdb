<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-black flex items-center justify-center p-4">
  <!-- Background decorative elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 right-10 w-32 h-32 bg-gray-600 rounded-full opacity-10 animate-pulse"></div>
    <div class="absolute bottom-20 left-20 w-24 h-24 bg-gray-500 rounded-full opacity-15 animate-bounce"></div>
    <div class="absolute top-1/3 right-1/4 w-16 h-16 bg-gray-400 rounded-full opacity-20"></div>
    <div class="absolute bottom-1/4 right-10 w-20 h-20 bg-gray-500 rounded-full opacity-10"></div>
  </div>

  <!-- Signup Card -->
  <div class="relative w-full max-w-lg">
    <div class="backdrop-blur-lg bg-white/10 border border-white/20 rounded-3xl p-8 shadow-2xl">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-gray-600 to-gray-800 rounded-2xl mb-4">
          <img src="/logo_tiny_white.png" alt="AMDB Logo">
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">Join AMDB</h1>
        <p class="text-gray-300">Create your account and explore the anime universe</p>
      </div>

      <!-- Signup Form -->
      <form (submit)="onSubmit()" [formGroup]="formData" class="space-y-5">
        <!-- Name Fields -->
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-2">
            <label for="firstName" class="text-sm font-medium text-gray-300">
              First Name
            </label>
            <div class="relative">
              <lucide-icon [img]="userIcon" class="absolute left-2 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
              <input
                type="text"
                id="firstName"
                name="firstName"
                formControlName="firstName"
                class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent transition-all duration-200"
                placeholder="First name"
                required
              />
            </div>
          </div>
          <div class="space-y-2">
            <label for="lastName" class="text-sm font-medium text-gray-300">
              Last Name
            </label>
            <div class="relative">
              <lucide-icon [img]="userIcon" class="absolute left-2 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
              <input
                type="text"
                id="lastName"
                name="lastName"
                formControlName="lastName"
                class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent transition-all duration-200"
                placeholder="Last name"
                required
              />
            </div>
          </div>
        </div>

        <!-- Email Field -->
        <div class="space-y-2">
          <label for="email" class="text-sm font-medium text-gray-300">
            Email Address
          </label>
          <div class="relative">
            <lucide-icon [img]="mailIcon" class="absolute left-2 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
            <input
              type="email"
              id="email"
              name="email"
              formControlName="email"
              class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent transition-all duration-200"
              placeholder="Enter your email"
              required
            />
          </div>
        </div>

        <!-- Password Fields -->
        <div class="grid grid-cols-1 gap-4">
          <div class="space-y-2">
            <label for="password" class="text-sm font-medium text-gray-300">
              Password
            </label>
            <div class="relative">
              <lucide-icon [img]="lockIcon" class="absolute left-2 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                name="password"
                formControlName="password"
                class="w-full pl-10 pr-12 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent transition-all duration-200"
                placeholder="Create password"
                required
                minlength="5"
              />
              <button
                type="button"
                (click)="togglePasswordVisibility()"
                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors duration-200"
              >
                <lucide-icon [img]="showPassword ? eyeOffIcon : eyeIcon" class="w-5 h-5"></lucide-icon>
              </button>
            </div>
          </div>
          <div class="space-y-2">
            <label for="confirmPassword" class="text-sm font-medium text-gray-300">
              Confirm Password
            </label>
            <div class="relative">
              <lucide-icon [img]="shieldIcon" class="absolute left-2 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></lucide-icon>
              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                id="confirmPassword"
                name="confirmPassword"
                formControlName="confirmPassword"
                class="w-full pl-10 pr-12 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent transition-all duration-200"
                [class.border-red-500]="checkConfirmPassword()"
                placeholder="Confirm password"
                required
              />
              <button
                type="button"
                (click)="toggleConfirmPasswordVisibility()"
                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors duration-200"
              >
                <lucide-icon [img]="showConfirmPassword ? eyeOffIcon : eyeIcon" class="w-5 h-5"></lucide-icon>
              </button>
            </div>
            <div *ngIf="formData.get('confirmPassword')?.hasError('notMatch')" class="text-red-400 text-sm">
              Passwords do not match
            </div>
          </div>
        </div>

        <!-- Password Strength Indicator -->
        <div *ngIf="formData.get('password')?.value" class="space-y-2">
          <div class="text-sm text-gray-300">Password Strength:</div>
          <div class="flex space-x-1">
            <div class="h-2 flex-1 rounded-full" [class]="getPasswordStrengthColor(0)"></div>
            <div class="h-2 flex-1 rounded-full" [class]="getPasswordStrengthColor(1)"></div>
            <div class="h-2 flex-1 rounded-full" [class]="getPasswordStrengthColor(2)"></div>
            <div class="h-2 flex-1 rounded-full" [class]="getPasswordStrengthColor(3)"></div>
          </div>
          <div class="text-xs text-gray-400">
            {{ getPasswordStrengthText() }}
          </div>
        </div>

        <!-- Signup Button -->
        <button
          type="submit"
          [disabled]="isLoading || !formData.valid"
          class="w-full py-3 px-4 bg-gradient-to-r from-gray-700 to-gray-900 hover:from-gray-600 hover:to-gray-800 text-white font-semibold rounded-xl shadow-lg transform transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 focus:ring-offset-transparent disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none"
        >
          <div *ngIf="isLoading" class="flex items-center justify-center space-x-2">
            <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            <span>Creating account...</span>
          </div>
          <div *ngIf="!isLoading" class="flex items-center justify-center space-x-2">
            <lucide-icon [img]="userPlusIcon" class="w-5 h-5"></lucide-icon>
            <span>Create Account</span>
          </div>
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-white/20"></div>
      </div>

      <!-- Login Link -->
      <div class="text-center mt-6">
        <p class="text-gray-300">
          Already have an account?
          <a [routerLink]="'/login'" class="text-gray-400 hover:text-gray-200 font-semibold transition-colors duration-200 ml-1">
            Sign in
          </a>
        </p>
      </div>
    </div>

    <!-- Bottom decorative glow -->
    <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2 w-32 h-8 bg-gradient-to-r from-gray-600 to-gray-800 opacity-30 blur-xl rounded-full"></div>
  </div>
</div>

<pre>{{ formData.value | json }}</pre>
<pre>{{ formData.valid | json }}</pre>
